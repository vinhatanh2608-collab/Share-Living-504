services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dorm
      MYSQL_USER: dorm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MongoDB username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MongoDB password}
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 24
  localstack:
    image: localstack/localstack:4.4.0
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3 access key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3 secret key}
      S3_BUCKET: ${S3_BUCKET:-dorm}
    ports: ["127.0.0.1:9000:4566"]
    volumes:
      - localstack-data:/var/lib/localstack
      - ./scripts/localstack-cors.json:/etc/shared-living/s3-cors.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal s3api get-bucket-cors --bucket "$$S3_BUCKET" --query 'CORSRules[].AllowedOrigins[]' --output text 2>/dev/null |
          grep -Fq 'http://127.0.0.1:1420' ||
          { (awslocal s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || awslocal s3 mb "s3://$$S3_BUCKET") &&
          awslocal s3api put-bucket-cors --bucket "$$S3_BUCKET" --cors-configuration file:///etc/shared-living/s3-cors.json; }
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql-data:
  mongo-data:
  localstack-data:
